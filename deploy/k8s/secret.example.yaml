# Secrets for the pension-chat backend: a TEMPLATE. Never commit real values.
#
# Create the real Secret from the cluster's secret store (Key Vault CSI driver,
# External Secrets, or by hand):
#
#   kubectl create secret generic pension-chat-secrets \
#     --from-literal=AZURE_OPENAI_API_KEY=... \
#     --from-literal=AZURE_SEARCH_API_KEY=... \
#     --from-literal=PGUSER=pension_app \
#     --from-literal=PGPASSWORD=... \
#     --from-literal=PBMS_SQL_USER=<read-only login, see deploy/sql/pbms_readonly_login.sql> \
#     --from-literal=PBMS_SQL_PASSWORD=... \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)"
#
# Rotate the OpenAI, Search and Postgres keys before go-live: they appeared in
# a development session's output on 2026-10-06.
apiVersion: v1
kind: Secret
metadata:
  name: pension-chat-secrets
  labels: { app: pension-chat }
type: Opaque
stringData:
  AZURE_OPENAI_API_KEY: "REPLACE"
  AZURE_SEARCH_API_KEY: "REPLACE"
  PGUSER: "pension_app"            # never novitasai_admin: it bypasses row-level security
  PGPASSWORD: "REPLACE"
  PBMS_SQL_USER: "REPLACE"         # NOT sa
  PBMS_SQL_PASSWORD: "REPLACE"
  JWT_SECRET_KEY: "REPLACE-with-at-least-32-random-characters"
