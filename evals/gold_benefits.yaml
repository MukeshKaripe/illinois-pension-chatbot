# Benefit types other than a retirement annuity.
#
# New ground, deliberately. Articles 11 and 12 carry all of this text, but the
# derivation path has only ever run on retirement annuities: every recipe in the
# registry, every applicability predicate, every worked example in the tests. So
# these are the cases most likely to fail, and the ones that will say the most
# when they do.
#
# The bar is not "produces a figure". A survivor benefit that cannot be computed
# from the text should say so, name what is missing, and not guess.

category: other_benefits

cases:
  - id: G26
    name: Which benefit is this even
    turns:
      - q: >-
          I am 56, still employed, and have just been told I cannot work again
          because of an injury. Before calculating anything, work out whether
          this is a retirement benefit, a duty disability benefit, an ordinary
          disability benefit, or something else.
        expect:
          no_figures: true
      - q: Explain why you ruled out the other benefit types.
        expect: {}

  - id: G27
    name: Disability running to its statutory end
    status: expected_fail
    gap: >-
      No disability recipe has ever been derived, and the transition from
      disability to a retirement annuity crosses provisions that the derivation
      prompt has only been exercised on single-provision cases.
    turns:
      - q: What would my duty disability benefit be?
        expect: { calculation: true }
      - q: Suppose I remain disabled until the statutory termination point. What happens then?
        expect: {}

  - id: G28
    name: Survivor benefit
    turns:
      - q: If I died today, what would my spouse be entitled to?
        expect:
          cites: ["11-145.1"]
      - q: Which facts about my spouse decide their eligibility?
        expect:
          # The member's own record cannot answer this, and the honest answer
          # says which facts are missing rather than assuming a spouse's age.
          asks_for_nothing_known: true

  - id: G29
    name: Service under two systems
    turns:
      - q: >-
          I have service under this fund and service under another Illinois
          retirement system. Can they be coordinated under the Reciprocal Act?
        expect:
          # This asked for Section 20-122 while Article 20 was uningested, and
          # ingesting it showed there is no such section: the Article numbers
          # 20-121 then 20-123, and Article 11 refers back to "the alternative
          # formula formerly set forth in Section 20-122". The case was
          # unpassable as written — an answer citing it would be a hallucination
          # the citation guardrail is there to reject. These three are what
          # actually govern combining service across systems.
          cites: ["20-115|20-117|20-121"]
          # Naming the Reciprocal Act must not read as asking about somebody
          # else's law: Article 20 governs this member, so their own Article
          # stays in the retrieval filter beside it.
          forbids: ["not covered by the statute text"]
