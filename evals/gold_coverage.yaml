# Which Article covers this member, and whether the assistant knows it does.
#
# Every case here comes from one real conversation. A member wrote "i am a park
# employee, how is my pension calculated?" and was told "As a park employee
# covered by Article 11, your pension is calculated under Section 11-134(a)",
# with a figure. Park employees are generally Article 12; their record said 11.
# The assistant welded their description of their job to a column on their file
# and asserted a connection the Pension Code does not make.
#
# Nothing caught it. Verification polices citations and figures, and that
# sentence contained no bad citation and no untraceable number — it was simply
# not true. The 43-case suite was green throughout.
#
# The rule these cases hold the assistant to: the record is the prior, not the
# oracle. A conflict in a value is an override with a note. A conflict in the
# field that decides *which law applies* is a question.

category: coverage

cases:
  - id: G31
    name: A description that points somewhere other than the record
    critical: true
    # Turn one of the reported conversation, verbatim.
    turns:
      - q: i am a park employee, how is my pension calculated?
        expect:
          act: asserted
          asks: true
          # The Article is precisely what is in doubt, so a pension worked out
          # from it is worse than a turn's delay.
          no_figures: true
          coverage_basis: record
          # The question has to quote the test it turns on. Those sections come
          # from a separate, unfiltered search, so an answer that names 12-101
          # without pinning its text is citing from memory — which is how the
          # first clarifying question ever asked got itself withdrawn.
          cites: ["12-101|12-118"]

  - id: G32
    name: The member answers, and it sticks
    critical: true
    # Turn four was worse than turn one. The member restated their coverage in
    # the statute's own literal words — "employee of a board of park
    # commissioners" IS the Section 12-101 test — and got the Article 11 figure
    # again, two turns after the assistant had already conceded the point.
    turns:
      - q: i am a park employee, how is my pension calculated?
        expect: { asks: true, no_figures: true }
      - q: i am an employee of a board of park commissioners, how is my pension calculated?
        expect:
          coverage_basis: member_confirmed
          coverage_article: "12"
          asks: false
          # Confirmed coverage elsewhere means the Code gets explained and the
          # record gets corrected by the fund. Their salary and service are
          # administered under Article 11 and are not the right basis for an
          # Article 12 figure; one computed across that gap would look
          # authoritative and trace to nothing.
          no_figures: true

  - id: G33
    name: Asking about an Article is not answering about one
    # Turn two. It names Article 12 twice and settles nothing — the member is
    # putting the question back. Binding it would have filed them into a fund on
    # the strength of their own uncertainty.
    turns:
      - q: i am a park employee, how is my pension calculated?
        expect: { asks: true }
      - q: >-
          i thought park employee's came under article 12, is it correct, if not
          what type of employees come under article 12?
        expect:
          coverage_basis: record
          cites: ["12-101|12-118"]
          no_figures: true

  - id: G34
    name: Quoting the assistant's own words back at it
    # Turn three: the member quotes the wrong sentence to object to it. Reading
    # the Article number out of that quotation confirmed them into the very
    # Article they were complaining about — and the next turn, now holding "an
    # answer", stopped asking.
    turns:
      - q: i am a park employee, how is my pension calculated?
        expect: { asks: true }
      - q: >-
          so when i said i was a park employee why did you say this "As a park
          employee covered by Article 11, your pension is calculated under
          Section 11-134(a)?"
        expect:
          coverage_basis: record
          coverage_article: "11"
          no_figures: true

  - id: G35
    name: A description that agrees with the record
    critical: true
    # The case that cannot exist with one seeded employee, and without which
    # every coverage check could only ever fire one way. This member says the
    # same words as G31 and their record agrees — so the assistant must
    # recognise that and answer, not ask.
    employee: article-12-standard
    turns:
      - q: i am a park employee, how is my pension calculated?
        expect:
          act: asserted
          asks: false
          coverage_basis: statutory_match
          coverage_article: "12"
          calculation: true

  - id: G36
    name: The member says they are unsure
    # An uncertainty marker is not a hedge to be stripped before parsing. It is
    # the member telling you the question is open, which makes it the clearest
    # case in the system for asking — even where their guess agrees with the
    # record.
    turns:
      - q: I think I'm a park employee — which Article covers me?
        expect:
          act: doubted
          asks: true
          no_figures: true

  - id: G37
    name: Saying nothing about yourself costs nothing
    # The fast exit, asserted as behaviour rather than left to trust. Most turns
    # take this path, and if it ever stops being free the whole suite gets
    # slower for a feature almost none of it uses.
    turns:
      - q: What does Section 11-134 say about the annuity formula?
        expect:
          asks: false
          no_calculation: true
          cites: ["11-134"]
          answers_from_article: "11"
