# One case per member fund, run as that fund's standard persona (spec §9, Phase 3b).
#
# A fund is offered as a profile only if its case here does not produce a figure
# from another Article's law, and it moves from `experimental` to `checked` in
# `funds.py` only when its case passes -- a decision made in config, never
# inferred. A pass means both: coverage resolves to the persona's own Article,
# and the calculation question gets either a figure resting on that Article's
# sections or the inputs it lacks (`fund_figure`). What it deliberately does not
# test is whether a figure is *right*; that is the benchmark's job, and the
# reason passing here is necessary for `checked` rather than sufficient.
#
# 11 and 12 are positive controls: already checked, and a failure there means
# the case is wrong rather than the fund.

category: fund_smoke

cases:
  - id: F02
    name: General Assembly member
    employee: article-2-standard
    turns:
      - q: Roughly what would my pension be if I retired at the end of this year?
        expect: { coverage_article: "2", fund_figure: "2" }

