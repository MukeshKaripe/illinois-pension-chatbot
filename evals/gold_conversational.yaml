# The behaviours the loop exists for: searching again after a bad search,
# reaching for a tool only when it is needed, computing under a premise the
# member supposed, and reusing knowledge already derived.
#
# None of these is marked `critical`. Critical in this suite means "a confident
# wrong answer does real harm" -- the wrong Article's figure, an unsupported
# formula the member supplied -- and `test_eval_suite.py` keeps that census
# explicit so the word keeps its meaning. These cases are about unhelpfulness,
# which is a different failure and a milder one. Revisit when Phase 3 flips them
# to `active`: L08 in particular can fail two ways, and one of them (Article 11's
# formula answering an Article 4 question) is the harmful kind.

category: conversational

cases:
  - id: L07
    name: A question in the member's words, answered from the Code's
    employee: article-11-standard
    # Passes on the pipeline, so it guards rather than measures. Worth being
    # honest about why: the member's own figure pulls 11-134 and the 11-133
    # family in regardless, so the colloquial phrasing is never really tested.
    # A case that measures *iterative* retrieval needs a question whose first
    # query genuinely misses, and which question that is can only be found by
    # measuring. Phase 3 should write one from an observed miss rather than a
    # guess -- guessing is what produced this case.
    status: active
    turns:
      - q: can I retire early without losing too much?
        expect:
          cites: ["11-134"]
          mentions: ["reduc", "0.25", "age 60"]

  - id: L08
    name: A figure under a premise the member supposed
    employee: article-11-standard
    # Promoted at cutover (2026-09-14), on two full-suite observations. The
    # gap was the pipeline's twice over: it first built the frame with
    # `article: None`, so retrieval never left Article 11 and handed the member
    # their own law for somebody else's question; after Phase 3b it reached
    # Article 3 -- police *outside* Chicago -- worked the figure from it and
    # then starved every input, citing the wrong fund and computing nothing.
    #
    # The loop resolves the supposition to Article 5 on Section 5-111 and works
    # $37,601.57 from Section 5-132(e). The member's own salary and service
    # stand in **because they asked for them** -- `_invited_stand_ins` checks
    # the invitation is really in their words, and this question is where that
    # check earns its keep: "with my salary and service" is an invitation, and
    # G38's "how would my pension be calculated?" is not.
    status: active
    turns:
      - q: if I were a Chicago police officer with my salary and service, what would I get?
        expect:
          calculation: true
          # It is a supposition throughout, and must read as one.
          conditional: true
          # Article 5 is the Chicago police fund -- Article 3 is police outside
          # Chicago, 4 is fire outside Chicago, 6 is Chicago fire. This case
          # asserted 4 until the baseline run made the mistake visible.
          #
          # `answers_from_article` rather than `article_only`, changed when the
          # loop first passed the substance of this case: it cited only Article
          # 5, worked the figure from Section 5-132, and had also *looked at*
          # Articles 1, 3 and 8 -- the neighbouring police fund it ruled out,
          # the laborers' fund, and a definition its own evidence cited. Looking
          # is not the harm this case exists for. The harm is one fund's formula
          # answering another fund's question with a real citation on it, which
          # is what the sharper key checks and `article_only` never did.
          answers_from_article: "5"

  - id: L09
    name: A question that needs no member and no calculation
    employee: article-11-standard
    # Promoted at cutover (2026-09-14), on two full-suite observations. The
    # gap was the pipeline's and it was structural: hybrid search over "what is
    # Article 11?" has nothing to match in 11-101 "Creation of fund", so the
    # most basic question about an Article could not reach the Article's own
    # opening sections. This is the case `outline` was built for — list the
    # headings, see 11-101, read it — and only an agent that chooses its next
    # call can use it.
    status: active
    turns:
      - q: what is Article 11?
        expect:
          no_calculation: true
          no_figures: true
          cites: ["11-101|11-102|11-103"]

  - id: L10
    name: The same calculation asked twice reuses what was derived
    employee: article-11-standard
    status: active
    turns:
      - q: what would my pension be if I retired now?
        expect: { calculation: true }
      - q: remind me what my annuity would come to?
        expect:
          calculation: true
          # Derived once, then read from the registry -- the point of the
          # registry, and the thing complaint #7 doubted was working.
          reuse: true
