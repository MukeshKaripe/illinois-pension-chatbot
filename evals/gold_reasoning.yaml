# Legal reasoning: which Article, which provision, why that one and not the
# others, and what has to be consulted before any of it can be calculated.
#
# The distinction these are built around is the one this system got wrong for a
# long time: a provision that does not reach the member is not the same as a
# provision that reaches them but cannot be computed from the text available.
# Reporting the second as the first tells a member the law does not govern them,
# which is untrue, and lets the easy-to-calculate provision win by default.

category: reasoning

cases:
  - id: G01
    name: Which Article governs this member
    critical: true
    turns:
      - q: Based on my employee record, which Article of the Illinois Pension Code governs my retirement benefits?
        expect:
          # `answers_from_article`, per L08. Measured before changing: the loop
          # answers "Article 11" citing Section 11-101 and nothing else, having
          # looked at 3, 9, 17, 20 and 1 in the course of ruling them out --
          # which is how you answer "which Article governs me" rather than a
          # symptom of getting it wrong.
          answers_from_article: "11"
          no_figures: true

  - id: G02
    name: Article isolation
    critical: true
    turns:
      - q: >-
          Identify the retirement provisions that apply to me, and name any
          similar-looking provisions in other Articles that must NOT be applied
          to my case.
        expect:
          cites: ["11-134"]
          # Naming Article 12 to warn the member off it is legitimate; reading
          # the member's benefit out of it is the failure this pilot exists to
          # catch. The comment said that from the beginning and the key said the
          # opposite: `article_only: "11"` forbade the first as well as the
          # second, so **the expectation forbade what the question asks for**.
          # A third way an eval case goes vacuous, after the two in
          # `baselines/README.md`: not a case that asserts its own diagnosis,
          # nor one whose subject got fixed, but one that disagrees with itself.
          # The loop named 8-138, 9-101 and 9-134 as the look-alikes -- exactly
          # what was asked -- and was marked down for it; the pipeline, which
          # cannot leave Article 11, named none and failed the `cites` half.
          #
          # `answers_from_article` is not the replacement either: it also
          # forbids citing 9-134, and a provision named without its number is
          # not named. What isolation means *here* is that the member's own
          # pathway is Article 11's and the others are named as excluded, so
          # that is what the case now asserts. The figure-side of isolation is
          # tested wherever a figure exists -- `worked the figure from` -- and
          # this turn has none.
          # Both halves, because the question has two. The member's own
          # pathway is Article 11's; the look-alikes are named out of other
          # Articles, and never attributed to them.
          cites_outside: "11"
          forbids:
            - "your Article 9"
            - "your Article 8"
            - "your Article 12"
            - "your Article 13"
            - "your Article 15"

  - id: G03
    name: Eligibility, without calculating
    turns:
      - q: >-
          Am I currently eligible to retire? Do not calculate my pension yet.
          Explain every eligibility condition you evaluated.
        expect:
          no_figures: true
          cites: ["11-134"]
      - q: Which of those conditions came from my record, and which from the Pension Code?
        expect:
          asks_for_nothing_known: true

  - id: G04
    name: Competing provisions, and why each was rejected
    critical: true
    turns:
      - q: Identify every retirement provision that could apply to my situation before selecting one.
        expect:
          cites: ["11-134"]
      - q: Which ones did you reject, and exactly why?
        expect:
          # The reviewer's point, and the bug behind it: a provision that
          # cannot be computed must not be described as inapplicable.
          forbids: ["does not apply because the actuarial", "not applicable because the conversion"]

  - id: G05
    name: Calculable is not the same as applicable
    turns:
      - q: >-
          Which provisions could you mathematically calculate from what you know
          about me, and which of those actually govern my case as a matter of
          law?
        expect:
          cites: ["11-134"]

  - id: G06
    name: Following the chain to the calculation inputs
    turns:
      - q: >-
          Which sections must be consulted before my retirement benefit can be
          calculated? Follow every cross-reference until the calculation
          dependencies are resolved.
        expect:
          # Service credit and salary are defined away from the benefit formula,
          # and the formula is meaningless without them.
          cites: ["11-134"]
      - q: Show me the dependency chain in order.
        expect: {}

  - id: G07
    name: A reference reaching into another Article
    turns:
      - q: >-
          My contribution rate under Section 11-170 depends on Section 1-160.
          Follow that reference and tell me which part of my determination comes
          from Article 1.
        expect:
          cites: ["1-160"]
      - q: Does Article 1 replace Article 11 for me, or only supply the rule it is referenced for?
        expect: {}

  - id: G20
    name: The rules in force at the time
    status: blocked
    blocked_by: needs historical amendments in the corpus, and an effective-date index
    turns:
      - q: Apply the retirement rules that were in effect when I first became eligible to retire.
        expect: {}
      - q: Now analyse the same facts under today's provisions, and tell me what changed.
        expect: {}
