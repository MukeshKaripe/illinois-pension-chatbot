turns:
- q: What does Section 8-137 say about automatic increases after retirement?
  goal: The automatic annual increase.
  reference: For retirements on or after 1987, a 3% increase, starting after the first anniversary of retirement
    or at age 60, whichever is later; from January 1999 it is 3% of the current annuity, so it compounds (§8-137).
