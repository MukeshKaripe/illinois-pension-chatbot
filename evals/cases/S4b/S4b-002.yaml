id: S4b-002
family: S4b
areas:
- calculation
- assumptions
tiers:
- smoke
- full
turns:
- q: An employee who joined in 2015 is 62, earns $80,000 and has 11 years of service. What is their annuity if they
    retire now?
  goal: A reduced Tier 2 annuity at 62.
  reference: 'Age 67 with at least 10 years of service credit (§1-160(c)); from age 62 with 10 years a reduced annuity,
    reduced by 1/2 of 1% for each full month under 67 (§1-160(c), §1-160(d)). A member first joining on or after
    July 6, 2017: age 65 with 10 years (§1-160(c-5)); members who joined 2011 to July 5, 2017 could elect the (c-5)
    age in exchange for higher contributions (§1-160(d-10)). Tier 2 final average salary: the highest total salary
    over 96 consecutive months (8 years) within the last 120 months (10 years) of service, divided by the months
    (years) in that period (§1-160(b)).'
  checks:
    calculation: true
    cites_any:
    - 1-160
    must_state:
    - '62'
    assumptions_disclosed: true
    ttft_class: heavy
- q: What if they wait until 67?
  goal: The unreduced annuity at 67 for comparison.
  reference: 'Age 67 with at least 10 years of service credit (§1-160(c)); from age 62 with 10 years a reduced annuity,
    reduced by 1/2 of 1% for each full month under 67 (§1-160(c), §1-160(d)). A member first joining on or after
    July 6, 2017: age 65 with 10 years (§1-160(c-5)); members who joined 2011 to July 5, 2017 could elect the (c-5)
    age in exchange for higher contributions (§1-160(d-10)).'
  checks:
    calculation: true
    cites_any:
    - 1-160
    no_reask:
    - age
    - salary
    - service
    - participation_date
    ttft_class: heavy
