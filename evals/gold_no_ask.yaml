# Asking for what is already known, which is complaint #1 made falsifiable.
#
# `article-11-standard` is 21.5 years of service on $72,000, with a date of
# birth and a ten-year salary history on file. A turn that asks this member for
# their salary, their service or their age is not being careful. It is being a
# form, and the member has to answer a question the system could have answered
# itself.
#
# These fail today for a reason worth stating precisely: a future-dated figure
# needs a salary and a service figure *at that date*, and `NEVER_ASSUMABLE`
# forbids inventing either. That ban is right -- assuming an unknown salary
# invents a member -- but it catches projection too, and projecting a known
# salary forward under a stated rule is what every pension estimator does.
# Phase 2 adds the projection class; Phase 3 lets the agent reach for it.
#
# None of these is marked `critical`. Critical in this suite means "a confident
# wrong answer does real harm" -- the wrong Article's figure, an unsupported
# formula the member supplied -- and `test_eval_suite.py` keeps that census
# explicit so the word keeps its meaning. These cases are about unhelpfulness,
# which is a different failure and a milder one. Revisit when Phase 3 flips them
# to `active`: L08 in particular can fail two ways, and one of them (Article 11's
# formula answering an Article 4 question) is the harmful kind.

category: no_ask

cases:
  - id: L01
    name: Two more years, answered rather than interrogated
    employee: article-11-standard
    status: expected_fail
    gap: >
      Measured against the pipeline on 2026-09-13, and the failure is worse than
      "it asks for a salary it already has" -- it does not ask at all. All three
      turns return the identical $32,126.78 computed on 21.5 years of service,
      which is the retire-now figure. Turn 2 says outright that "a 3% raise each
      year does not produce a new pension figure here", and turn 3 still
      "assumes 21.5 years". So a future-dated question is silently answered as a
      present-dated one, under a disclosure that reads as though it had
      projected. Needs the projection input class (Phase 2) and an agent that
      reaches for it (Phase 3).
    turns:
      - q: if I work two more years, what would my pension be?
        expect:
          # Everything needed is on file or derivable from it.
          asks: false
          asks_for_nothing_known: true
          # `calculation` and `mentions` alone are satisfied by the wrong
          # answer -- the retire-now figure carries its own "assuming you
          # withdraw today" disclosure, and passed this case until the baseline
          # run showed the number had not moved. The service figure is what
          # proves a projection happened: 21.5 on file, two more years, 23.5.
          uses_input: { service_years: 23.5 }
          calculation: true
          mentions: ["assum", "held flat", "as it stands"]

      # A correction to the projection rule, not a new question.
      - q: assume I get a 3% raise each year
        expect:
          asks: false
          recompute: true
          calculation: true

      # A correction to a fact. The figure must move; nothing else should.
      - q: actually I'm 57
        expect:
          asks: false
          recompute: true
          calculation: true

  - id: L02
    name: A figure the record alone can support, asked for plainly
    employee: article-11-standard
    status: active
    turns:
      - q: what would my pension be if I retired now?
        expect:
          asks_for_nothing_known: true
          calculation: true
          cites: ["11-134"]
