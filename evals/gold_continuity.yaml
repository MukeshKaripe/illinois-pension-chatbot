# Conversational continuity: what the conversation holds between turns.
#
# Every case here is multi-turn on one thread, because that is the only way the
# behaviour exists. The graph is checkpointed, so turn two resumes from what
# turn one established rather than being handed a transcript to re-read -- and
# the defects this suite watches for are all failures of that resumption:
# a value the member gave being asked for again, a supposition surviving the
# member leaving it, a correction read as a new question.

category: continuity

cases:
  - id: C01
    name: A follow-up inherits the figure's own inputs
    employee: article-11-standard
    turns:
      - q: What would my pension be if I retired at the end of this year?
        expect:
          calculation: true
      - q: How does that compare with waiting until I am 60?
        expect:
          scenarios: true
          # Only the retirement date moves. The whole point of a one-variable
          # comparison is that everything else is held still.
          unchanged: ["final_average_salary"]

  - id: C02
    name: A correction is a correction, not a new question
    employee: article-11-standard
    turns:
      - q: What would I get if I retired at 58?
        expect:
          calculation: true
      - q: Actually, make that three more years from now instead.
        expect:
          recompute: true
          unchanged: ["final_average_salary"]

  - id: C03
    name: A supposition survives the follow-up that explores it
    employee: article-11-standard
    turns:
      - q: If I were a Chicago firefighter, how would my pension be worked out?
        expect:
          hypothetical: true
          conditional: true
          act: stipulated
      - q: And what would happen to my spouse?
        expect:
          # The member has not stepped out of the supposition, so it must still
          # be held -- dropping it answers the second question about a different
          # person from the first.
          hypothetical: true
          conditional: true

  - id: C04
    name: A supposition ends when the member ends it
    employee: article-11-standard
    turns:
      - q: If I were a park employee, which provisions would apply?
        expect:
          hypothetical: true
          conditional: true
      - q: Alright, back to my own situation. Which provisions apply to me?
        expect:
          hypothetical: false
          coverage_basis: record
          answers_from_article: "11"

  - id: C05
    name: A value the member gave survives the turns between
    employee: article-11-standard
    turns:
      - q: I actually have 25 years of service, not what your records say.
        expect:
          # Stating a value is not asking for a calculation.
          no_figures: true
      - q: What does Section 11-134 say about the reduction for going early?
        expect:
          cites: ["11-134"]
      - q: So what would my pension be?
        expect:
          # The fact ledger's acceptance test: a value stated three turns ago is
          # still theirs, and the member is not asked for it twice. Without the
          # ledger this resolved off the record and the correction was lost.
          uses_input: {service_years: 25}

  - id: C06
    name: Why that provision and not its neighbour
    employee: article-11-standard
    turns:
      - q: What would my pension be if I stopped working now?
        expect:
          calculation: true
      - q: Why did you use that section rather than 11-130?
        expect:
          cites: ["11-134"]
          no_calculation: true
