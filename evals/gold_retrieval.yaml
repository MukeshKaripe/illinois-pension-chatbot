# Retrieval intelligence: questions the first search does not answer.
#
# The loop searches before the model is asked anything and closes the evidence
# over what that text cross-references, all before the first model call. These
# are the questions that machinery exists for: the operative rule is not in the
# section the query matches, it is in the one that section sends you to.
#
# Article 11 is written in cross-references -- 11-134 computes on service "as
# service is defined or computed in Section 11-216", and 11-216 points at
# 11-164 -- so a question about the inputs to a figure is answered two hops
# from where a search lands.

category: retrieval

cases:
  - id: X01
    name: The answer is one hop from the match
    employee: article-11-standard
    turns:
      - q: How is the service my annuity is based on actually worked out?
        expect:
          # 11-134 is what a search for this matches; 11-216 is what answers it.
          cites: ["11-216|11-164"]
          no_figures: true

  - id: X02
    name: A follow-up that names nothing
    employee: article-11-standard
    turns:
      - q: I am thinking about leaving before I turn 60.
        expect:
          cites: ["11-134"]
      - q: What are the things needed, please list them.
        expect:
          # Searched on its own this returned the Code's rules for pension fund
          # investment advisers under §1-113.5 -- a precise answer to a question
          # nobody asked. The previous message is what says which "things", and
          # `_contextual_queries` is what puts it in the search.
          answers_from_article: "11"
          no_figures: true

  - id: X03
    name: The member's words, not the statute's
    employee: article-11-standard
    turns:
      - q: Am I losing money by going early? It feels like a lot.
        expect:
          # The Code says "annuity reduction"; the member says "losing money".
          # Retrieval has to cross that gap without being told the section.
          cites: ["11-134"]

  - id: X04
    name: A heading that reads like the better match and is not
    employee: article-11-standard
    turns:
      - q: >-
          Which section actually sets the amount of my retirement annuity, and
          why not the one about present employees and future entrants?
        expect:
          # §11-130 is "Annuities -- Present employees and future entrants",
          # which reads like the answer and is not; §11-134 is "Amount of
          # annuity", which is. Browsing headings picks the wrong one.
          cites: ["11-134"]
          no_figures: true
