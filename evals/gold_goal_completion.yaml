# Whether the answer served the question, which calling tools cannot show.
#
# An agent can search competently, compute correctly, cite honestly, and still
# answer two thirds of what was asked. `needs_figure` is a boolean, so a turn
# containing an eligibility question and a calculation question collapses to
# one of them -- and the member has to ask the other half again.
#
# None of these is marked `critical`. Critical in this suite means "a confident
# wrong answer does real harm" -- the wrong Article's figure, an unsupported
# formula the member supplied -- and `test_eval_suite.py` keeps that census
# explicit so the word keeps its meaning. These cases are about unhelpfulness,
# which is a different failure and a milder one. Revisit when Phase 3 flips them
# to `active`: L08 in particular can fail two ways, and one of them (Article 11's
# formula answering an Article 4 question) is the harmful kind.

category: goal_completion

cases:
  - id: L03
    name: Eligibility and amount are one question, not two
    employee: article-11-standard
    status: expected_fail
    gap: >
      Measured against the pipeline on 2026-09-13. Both halves of the question
      are answered, so goal decomposition was not the gap -- but the figure is
      internally contradictory. The inputs it computed on were
      age_at_annuity_start 58, months_before_age_60 44, service_years 21.5,
      withdrawal_date today: 44 months is the reduction for a member of 56, and
      21.5 years is the service they have now. So it takes the 58 for the label
      and computes the retire-now figure underneath it. Needs projection
      (Phase 2) reaching every input a future date moves, not just the one the
      member named.
    turns:
      - q: I'm thinking of retiring at 58. Am I eligible, and how much would I get?
        expect:
          calculation: true
          # Two years on from 56 is 23.5 years of service. Without this the
          # case passes on a figure whose own inputs disagree -- which is how
          # it passed on the baseline run.
          uses_input: { service_years: 23.5 }
          # The eligibility half, in the Code's own terms.
          mentions: ["eligib", "qualif", "20 years", "age 55"]
          cites: ["11-134|11-130"]

  - id: L04
    name: A correction modifies the scenario rather than starting over
    employee: article-11-standard
    # Passes on the pipeline, so it guards rather than measures: a named
    # retirement age is a revision `extract_scenarios` can already see, which
    # is why this works where L01 turn 2 ("assume I get a 3% raise") does not.
    # The raise is not a fact the worksheet holds, so nothing goes stale.
    status: active
    turns:
      - q: what would I get if I worked two more years?
        expect: { calculation: true }
      - q: actually make that three years
        expect:
          asks: false
          recompute: true
          calculation: true

  - id: L05
    name: A follow-up about a spouse continues the conversation
    employee: article-11-standard
    status: expected_fail
    gap: >
      Measured against the pipeline on 2026-09-13. "What about my wife?" carries
      no benefit vocabulary, so retrieval returned 11-148.1, 11-167, 11-110.1
      and 11-149 rather than the survivor annuity sections, the answer said
      none of "survivor", "widow" or "spouse", and the guardrail rejected what
      was written (ASSUMPTION_NOT_DISCLOSED) so the member saw the fallback.
      Needs the turn read as a continuation of what came before it (Phase 3).
    turns:
      - q: what would my pension be if I retired at the end of this year?
        expect: { calculation: true }
      # Names no benefit, no section and no age. It is a survivor question
      # only because of what came before it.
      - q: what about my wife?
        expect:
          asks: false
          mentions: ["survivor", "widow", "spouse"]
          cites: ["11-145|11-145.1|11-153"]

  - id: L06
    name: A question about another Article is answered as law, not as this member
    employee: article-11-standard
    status: active
    turns:
      - q: what does Article 4 provide for police officers?
        expect:
          article_only: "4"
          no_figures: true
