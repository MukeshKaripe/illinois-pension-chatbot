turns:
- q: if I were a park employee, how would my pension be calculated?
- a: 'If you were a park employee covered by Article 12, you would generally qualify
    for a retirement annuity after age 50 with at least 10 years of service, or at
    age 60 with at least 4 years of service. [40 ILCS 5/12-133]


    Your annuity would generally be based on **2.40% for each year of service** multiplied
    by your highest average annual salary for any 4 consecutive years within your
    last 10 years of service. Service of less than a full year would be prorated.
    The annuity could not exceed **80%** of that salary average. [40 ILCS 5/12-133]


    If you retired before age 60, your annuity would be reduced by **0.25% for each
    month or fraction of a month** that you were under age 60. That reduction would
    not apply if you were age 50 or older with at least 30 years of service. [40 ILCS
    5/12-133]


    The park-employee definition covers people serving a board of park commissioners,
    subject to the conditions in the section. [40 ILCS 5/12-118] The fund itself is
    established for employees of qualifying park boards in cities with more than 500,000
    residents. [40 ILCS 5/12-101]


    Section 12-130 was weighed, but it does not provide the retirement-annuity formula
    for the circumstances described here.'
