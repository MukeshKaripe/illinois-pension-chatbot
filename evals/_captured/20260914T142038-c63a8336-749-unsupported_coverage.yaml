turns:
- q: how is my pension calculated?
- a: 'Your estimated Article 5 pension is **$65,660.68 per year**, or **$5,471.72
    per month**, under Section 5-132. [40 ILCS 5/5-132]


    This estimate uses:


    - **24.5 years** of service

    - **$107,201.12** final average salary

    - Age **50**

    - Retirement on **September 14, 2026**


    **What I assumed:** You stop working today, September 14, 2026.


    Section 5-126 also addresses a present employee age 50 or older with at least
    10 years of service. Section 5-129 addresses a future entrant age 50 or older
    with at least 10 years of service. Your record identifies you as **Tier 1**, so
    the estimate rests on Section 5-132 rather than those provisions. [40 ILCS 5/5-126]
    [40 ILCS 5/5-129]


    Section 5-167.1 provides automatic increases for a policeman who retires with
    at least 20 years of service credit, subject to its conditions. The estimate above
    is the initial pension amount and does not include future increases. [40 ILCS
    5/5-167.1]


    I’m going by your record, which places you in Article 5 — tell me if that’s not
    right.


    This is an estimate — your retirement fund makes the binding determination.'
- q: what if my years of service is 30 years?
- a: 'Changing your service from **24.5 years to 30.0 years** changes the estimated
    annual pension under Section 5-132 from **$65,660.68** to **$80,400.84**—or **$6,700.07
    per month**. [40 ILCS 5/5-132]


    **What I assumed:** Your annuity start date is **September 14, 2026**, used as
    the date you stop working.


    Section 5-167.1 provides automatic increases for a policeman who retires with
    at least 20 years of service credit, but the timing and amount of those increases
    depend on additional facts, including your retirement date and age. [40 ILCS 5/5-167.1]
    I could not establish those future increases from the provisions available here.


    This is an estimate — your retirement fund makes the binding determination.'
