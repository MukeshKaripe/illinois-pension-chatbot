[project]
name = "pension-chat"
version = "0.1.0"
description = "Illinois Pension Code Chatbot - AI-powered pension Q&A with deterministic calculation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.0.0",
    # AI / LLM
    "openai>=1.82.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    # Azure services
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.19.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    # Config & utils
    # `pydantic[email]` rather than plain pydantic: signup takes EmailStr, and
    # email is the account identity, so a bare `str` there is not a field type.
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    # Hashing / fingerprinting
    "xxhash>=3.5.0",
    # Tiktoken for token counting
    "tiktoken>=0.8.0",
    "psycopg2-binary>=2.9.12",
    "aiohttp>=3.14.3",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "azure-storage-blob>=12.30.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pension_chat"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
